# -------------------------------------------------------
# Application
# -------------------------------------------------------
spring.application.name=RoadAlignmentDesignSystem 

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
# Default logging level for the application.
logging.level.root=INFO

# Detailed logging for our application classes.
logging.level.geodesy.roadalignment=DEBUG


# ----------------------------------------------------------------
# Alignment configuration
# ----------------------------------------------------------------

# Alignment generation

road-alignment.alignment.sample-interval=5.0

road-alignment.alignment.alternative-offsets=-0.25,-0.12,0.0,0.12,0.25

road-alignment.alignment.same-point-tolerance=1e-9

road-alignment.alignment.first-control-point-fraction=0.33

road-alignment.alignment.second-control-point-fraction=0.66

# Grid generation

road-alignment.alignment.grid-spacing=2.5

road-alignment.alignment.max-grid-nodes=50000

# Alternative route search

road-alignment.alignment.max-alternatives=5

road-alignment.alignment.max-endpoint-connections=8

road-alignment.alignment.max-search-attempts=15

# Algorithm (route cost)

road-alignment.alignment.slope-weight=75.0

road-alignment.alignment.elevation-weight=2.0

road-alignment.alignment.elevation-scale=5.0

road-alignment.alignment.reused-edge-penalty=4.0


# ----------------------------------------------------------------
# Terrain configuration
# ----------------------------------------------------------------

road-alignment.terrain.coordinate-tolerance=1e-10

road-alignment.terrain.barycentric-tolerance=1e-10

road-alignment.terrain.circumcircle-tolerance=1e-10

road-alignment.terrain.super-triangle-multiplier=20.0

road-alignment.terrain.contour-interval=1.0


# ----------------------------------------------------------------
# Road design configuration
# ----------------------------------------------------------------

road-alignment.road.road-width=8.0